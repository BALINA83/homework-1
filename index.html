<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/checkbox.css">
  <link rel="stylesheet" href="css/loader.css">

</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none">

 

  <symbol id="instagram" viewBox="0 0 24 24">
    <path fill="currentColor"
      d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-.9a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z"/>
  </symbol>


  <symbol id="icon-facebook" viewBox="0 0 20 20">
    <path d="M13.3 3.3h1.9V0.1C14.8 0.1 13.8 0 12.5 0 9.9 0 8.1 1.7 8.1 4.7V7.5H5.2V11h2.9V20h3.6V11h2.8l0.4-3.5h-3.2V5c0-1 0.3-1.7 1.6-1.7z" fill="currentColor"/>
  </symbol>

  <symbol id="icon-linkedin" viewBox="0 0 20 20">
    <path d="M0.3 6.6h4.1V20H0.3V6.6zM2.4 0a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8zM7.1 6.6h3.8v1.8h0.1c0.5-1 1.8-2 3.7-2 4 0 4.7 2.6 4.7 6V20h-4.1v-5.9c0-1.4 0-3.2-2-3.2s-2.3 1.5-2.3 3.1V20H7.1V6.6z" fill="currentColor"/>
  </symbol>

</svg>

<div class="page">
  <div class="auth">
    <div class="auth-tabs">
  
      <input type="radio" name="tab" id="login" checked>
      <input type="radio" name="tab" id="register">

      <label for="login">Login</label>
      <label for="register">Register</label>

      <span class="tab-indicator"></span>
    </div>


    <!-- Form -->
    <form class="auth-form login-form">
      <h2>Login</h2>

      <input type="email" placeholder="E-mail">
      <input type="password" placeholder="Password">
      

      <div class="form-row">
        <label class="checkbox">
          <input type="checkbox">
          <span></span>
          Remember Me
        
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Login</button>

      <p class="form-footer">
        Don’t have an account yet?
      <a href="registration.html">Register</a>   

      </p>
      <p class="or-login">Or login</p>
      


    <div class="social">
  <svg class="social-icon">
    <use href="#instagram"></use>
  </svg>

  <svg class="social-icon">
    <use href="#icon-facebook"></use>
  </svg>

  <svg class="social-icon">
    <use href="#icon-linkedin"></use>
  </svg>
</div>


     
    </form>
   
<form class="auth-form register-form">
  <h2>Register</h2>

  <input type="text" placeholder="Name">
  <input type="email" placeholder="E-mail">
  <input type="password" placeholder="Password">

  <button type="submit">Register</button>

  <p class="form-footer">
    Already have an account?
    <label for="login" class="switch-link">Login</label>
  </p>
</form>

  </div>
</div>

</body>
</html>
